<style>
/* Layout: a clock with three dials (chapter, sub-chapter, scene) on a dark bench; your inputs on the right, your chapters on the left; phones stack. */
:root{

  --ivory:#F2E6CC; --muted:#A3958A; --gold:#D9A57A; --ember:#FF6B2C;

  color-scheme: dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{background:var(--void);color:var(--ivory);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select{font:inherit;color:inherit}
.app{position:relative;height:100%;width:100%}
#stage{position:absolute;inset:0;overflow:hidden;touch-action:none;z-index:0}

.labels{position:absolute;inset:0;pointer-events:none}
.topbar{position:absolute;z-index:3;top:0;left:0;right:0;padding-top:calc(14px + env(safe-area-inset-top,0px));padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));display:flex;justify-content:space-between;align-items:flex-start;gap:16px;pointer-events:none}
.topbar > *{pointer-events:auto}
.kicker{font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
h1{font-family:var(--display);font-weight:500;font-size:clamp(30px,3.4vw,44px);line-height:1;margin:.15em 0 0}
.readout{text-align:right}
.readout .now{font-family:var(--display);font-size:22px;line-height:1.15}
.readout .now em{color:var(--ember);font-style:italic}
.readout .sub{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:3px}
.modes{display:inline-flex;margin-top:10px;border:1px solid var(--rule);border-radius:999px;padding:3px;background:var(--glass);backdrop-filter:blur(6px)}
.modes button{border:0;background:transparent;padding:7px 14px;border-radius:999px;font-family:var(--mono);font-size:12px;letter-spacing:.06em;cursor:pointer;color:var(--muted)}
.modes button[aria-pressed="true"]{background:var(--ivory);color:var(--void)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ember);outline-offset:2px}

.panel{position:absolute;z-index:3;top:150px;width:300px;max-height:calc(100% - 290px);overflow:auto;background:var(--glass);border:1px solid var(--rule);border-radius:14px;padding:14px 16px;backdrop-filter:blur(8px)}
.panel.left{left:max(20px,env(safe-area-inset-left,0px))}
.panel.right{right:max(20px,env(safe-area-inset-right,0px))}
.panel h2{font-family:var(--mono);font-weight:500;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin:0 0 8px}
.md-list{display:flex;flex-direction:column}
.md{display:grid;grid-template-columns:12px 1fr auto;gap:10px;align-items:center;padding:6px 2px;border-top:1px solid var(--rule)}
.md:first-child{border-top:0}
.md .dot{width:11px;height:11px;border-radius:50%}
.md .who{font-family:var(--display);font-style:italic;font-size:17px;line-height:1.05}
.md .nm{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.md .yr{font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums;text-align:right;color:var(--muted)}
.md.cur{background:rgba(255,107,44,.10);border-radius:6px}
.md.cur .yr{color:var(--ivory)}
.md.past{opacity:.55}
.deep{margin-top:12px;padding-top:10px;border-top:1px solid var(--rule);font-family:var(--mono);font-size:12px;line-height:1.6}
.deep b{font-weight:500;color:var(--ivory)}
.deep span{color:var(--muted)}
.explain h3{font-family:var(--display);font-weight:500;font-size:25px;line-height:1.05;margin:2px 0 8px}
.explain p{margin:0 0 10px;color:#E3D7C0}
form{display:grid;gap:8px;margin:10px 0 6px}
label{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:grid;gap:4px}
input[type=date],select,input[type=number]{background:#0f0d0b;border:1px solid var(--rule);border-radius:8px;padding:7px 9px;font-family:var(--mono);font-size:13px;letter-spacing:0;text-transform:none;color:var(--ivory);width:100%;min-width:0}

.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row2 > label{min-width:0}
.note{font-family:var(--mono);font-size:10.5px;color:var(--muted);line-height:1.5}
.formula{margin-top:10px;padding:10px 12px;border:1px solid var(--rule);border-radius:10px;font-family:var(--mono);font-size:12px;line-height:1.55}
.formula b{color:var(--ember);font-weight:500}
.example{display:inline-block;font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--void);background:var(--gold);border-radius:4px;padding:1px 6px;margin-left:6px;vertical-align:middle}

.age{font-family:var(--mono);font-size:12px;color:var(--ivory);white-space:nowrap;font-variant-numeric:tabular-nums;min-width:120px;text-align:right}
.chip{border:1px solid var(--ember);background:var(--glass);border-radius:999px;padding:6px 12px;font-family:var(--mono);font-size:11.5px;cursor:pointer;color:var(--ember);white-space:nowrap}
.credit{font-family:var(--mono);font-size:10.5px;color:var(--muted)}

.lbl{font-family:var(--mono);color:var(--ivory);white-space:nowrap;text-align:center}
.l-md{font-family:var(--display);font-style:italic;font-size:15px;line-height:1.05;text-shadow:0 1px 5px #000}

.l-md.cur{color:var(--ember)}
.l-ad{font-size:10.5px;color:#E8DCC4;text-shadow:0 1px 4px #000}
.l-ad.cur{color:var(--ember)}
.l-pd{font-size:9.5px;color:var(--muted)}
.l-pd.cur{color:var(--ember)}
.l-ring{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);text-align:left}
.l-ring i{display:block;font-family:var(--display);font-size:14px;letter-spacing:0;text-transform:none;color:var(--muted)}
.l-now{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ember)}
.l-moon{font-family:var(--display);font-style:italic;font-size:14px;color:var(--muted)}

@media (max-width: 900px){
  body{overflow:auto}
  .app{display:flex;flex-direction:column;height:auto;min-height:100%}
  .topbar{position:relative;order:1;flex-wrap:wrap}
  .readout{text-align:left;width:100%}
  .modes{width:100%}
  .modes button{flex:1}
  #stage{position:relative;order:2;height:62vh;min-height:360px;max-height:620px}
  .dock{position:relative;order:3;padding-top:10px}
  .panel{position:relative;order:5;top:auto;left:auto!important;right:auto!important;width:auto;max-height:none;margin:12px max(16px,env(safe-area-inset-left,0px)) 0 max(16px,env(safe-area-inset-right,0px))}
  .panel.right{order:4}
  .panel.left{margin-bottom:24px}
  .l-md small,.l-pd,.l-ring i{display:none}
  .l-md{font-size:12.5px}
  .l-ad{font-size:9.5px}
  .time{flex-wrap:wrap;border-radius:18px;padding:8px 12px}
  .time input{order:4;flex:1 1 100%}
  .age{min-width:0;flex:1;text-align:left}
}

        <label>Or Moon’s exact sign <select id="msign"><option value="">Not sure</option></select></label>
        <label>and degree <input type="number" id="mdeg" min="0" max="29.99" step="0.01" placeholder="e.g. 14.5"></label>

    <div class="formula" id="formula"></div>
  </aside>

  <footer class="dock">
    <div class="time">
      <button class="play" id="play" aria-label="Play your years forward"><svg viewBox="0 0 10 10" id="playicon"><path d="M2 1 L9 5 L2 9 Z"/></svg></button>
      <input type="range" id="age" min="0" max="1200" value="0" step="1" aria-label="Age in years">
      <span class="age" id="agetxt">—</span>
      <button class="chip" id="today">Today</button>
    </div>

  </footer>
</div>

      const gr = .16 + gg.y*.021, teeth = gg.y + 6;
      const gear = new THREE.Mesh(gearGeo(gr, teeth, .14), new THREE.MeshStandardMaterial({color:gg.rim?0x3a2f28:gg.c, roughness:.4, metalness:.55, emissive: gg.rim?0xFF6B2C:0x000000, emissiveIntensity: gg.rim?.25:0}));
      gear.position.copy(P(mid,(L.rIn+L.rOut)/2,.06)); d.spin.add(gear); d.gears.push({gear, i:p.i, j});
      const l = mkLabel(`${gg.who}<small>${gg.k.toUpperCase()} · ${gg.y} YRS</small>`,'lbl l-md'); l.position.copy(P(mid, L.rOut+.55)); d.spin.add(l); d.labels.push(l);
    } else {
      const l = mkLabel(key==='ad' ? `${gg.ab}` : `${gg.ab}`,'lbl '+(key==='ad'?'l-ad':'l-pd')); l.position.copy(P(mid,(L.rIn+L.rOut)/2,.05)); d.spin.add(l); d.labels.push(l);
    }
    a += span;
  });
  // rim lines
  for(const r of [L.rIn, L.rOut]){ const pts=[]; for(let i=0;i<120;i++){ const q0=P(i*3,r,.03), q1=P((i+1)*3,r,.03); pts.push(q0.x,q0.y,q0.z,q1.x,q1.y,q1.z); } const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.Float32BufferAttribute(pts,3)); d.spin.add(new THREE.LineSegments(g,new THREE.LineBasicMaterial({color:0xD9A57A,transparent:true,opacity:.5}))); }
  d.parts = parts; d.total = totalYears;
}

/* ---------- state & UI ---------- */
const $ = id=>document.getElementById(id);
NAKS.forEach((n,i)=>{ const o=document.createElement('option'); o.value=i; o.textContent=`${n} · ${G[i%9].k}’s star`; $('nak').appendChild(o); });
SIGNS.forEach((s,i)=>{ const o=document.createElement('option'); o.value=i; o.textContent=s; $('msign').appendChild(o); });
$('nak').value = 9; // example: Magha
let S, mode='assembled', viewMs = Date.now(), playing=false, isExample = true;
const mix = {ex:0};
try{ const saved = JSON.parse(localStorage.getItem('sutram-gearbox')||'null'); if(saved){ $('bdate').value=saved.b; $('nak').value=saved.n; $('frac').value=saved.f; $('msign').value=saved.s??''; $('mdeg').value=saved.d??''; isExample=false; } }catch(e){}

function readInputs(){
  const b = Date.parse($('bdate').value+'T12:00:00Z'); let n = +$('nak').value, f = +$('frac').value/100;
  const ms = $('msign').value, md = parseFloat($('mdeg').value);
  if(ms!=='' && !isNaN(md) && md>=0 && md<30){ const lon = (+ms)*30 + md; n = Math.floor(lon/(40/3)); f = (lon%(40/3))/(40/3); $('nak').value=n; $('frac').value=Math.round(f*100); }
  return {b: isNaN(b)? Date.parse('1990-01-01T12:00:00Z') : b, n, f};
}
function recompute(save){
  const {b,n,f} = readInputs();
  S = setup(b, n, f);
  const pada = Math.min(4, Math.floor(f*4)+1);
  $('fracnote').textContent = `${Math.round(f*100)}% through ${NAKS[n]} (pada ${pada}). At birth the chapter of ${G[S.lord].who} (${G[S.lord].k}) had ${dur((1-f)*G[S.lord].y)} left.`;
  $('exnote').innerHTML = (isExample? '<span class="example">Example</span> ' : '') + (($('msign').value!=='' && $('mdeg').value!=='') ? 'Exact Moon degree used.' : 'Using the nakshatra and how far through it. Add your Moon’s sign and degree for exact dates.');
  $('age').max = 1200;
  if(save){ isExample=false; try{ localStorage.setItem('sutram-gearbox', JSON.stringify({b:$('bdate').value,n:$('nak').value,f:$('frac').value,s:$('msign').value,d:$('mdeg').value})); }catch(e){} recompute(false); return; }
  moonLbl.element.textContent = `Moon in ${NAKS[n]}`;
  lastKey = '';
}
['bdate','nak','frac','msign','mdeg'].forEach(id=>$(id).addEventListener('input',()=>recompute(true)));
$('f').addEventListener('submit',e=>e.preventDefault());

const EX = {
  assembled:['How it works','Your life runs on a 120-year clock',[
    'Vimshottari gives each of the nine grahas a chapter of fixed length, from 6 years for the king to 20 for the lover. Together they make 120 years.',
    'The Moon’s nakshatra at your birth picks the first chapter, and how far the Moon had walked through it says how much of that chapter was already used up.']],
  apart:['Taken apart','Chapter, sub-chapter, scene',[
    'Each chapter splits into nine sub-chapters in the same order and proportions, starting with its own graha. Each sub-chapter splits again into nine scenes.',
    'The orange line drops through all three dials: the chapter sets the theme, the sub-chapter the season, the scene the weeks.']],
};
function setMode(m){ mode=m; ['assembled','apart'].forEach(k=>$('m-'+k).setAttribute('aria-pressed',k===m?'true':'false'));
  const [k,h,ps]=EX[m]; $('ex-k').textContent=k; $('ex-h').textContent=h; $('ex-b').innerHTML=ps.map(p=>`<p>${p}</p>`).join('');
  camTween={from:{p:camera.position.clone(),t:controls.target.clone()}, to:poseOf(m), k:0, dur:REDUCED?.01:1.3}; }
$('m-assembled').addEventListener('click',()=>setMode('assembled')); $('m-apart').addEventListener('click',()=>setMode('apart'));
{ const [k,h,ps]=EX.assembled; $('ex-b').innerHTML=ps.map(p=>`<p>${p}</p>`).join(''); }

$('age').addEventListener('input',()=>{ viewMs = S.birthMs + (+$('age').value/10)*YEAR; });
$('today').addEventListener('click',()=>{ viewMs = Date.now(); playing=false; setPlay(); });
function setPlay(){ $('playicon').innerHTML = playing?'<path d="M2 1h2.2v8H2zM5.8 1H8v8H5.8z"/>':'<path d="M2 1 L9 5 L2 9 Z"/>'; }
$('play').addEventListener('click',()=>{ playing=!playing; if(playing && viewMs>=S.birthMs+119*YEAR) viewMs=S.birthMs; setPlay(); });

/* camera */
const POSE = {assembled:new THREE.Vector3(0,12,9.5), apart:new THREE.Vector3(10.5,6.5,10.5)};
const EXT = {assembled:[6.6,6.0], apart:[7.2,5.4]};
function poseOf(m){ const w=stage.clientWidth, h=Math.max(1,stage.clientHeight), effW = w>900? w-720 : w;
  const v=camera.fov*D/2, hh=Math.atan(Math.tan(v)*effW/h), [W,H]=EXT[m], dist=Math.max(W/Math.tan(hh),H/Math.tan(v))*1.05;
  return {p:POSE[m].clone().normalize().multiplyScalar(dist), t:new THREE.Vector3(0, m==='apart'?.2:0, 0)}; }
let camTween=null;
function resize(){ const w=stage.clientWidth,h=stage.clientHeight; renderer.setSize(w,h,false); labelR.setSize(w,h); camera.aspect=w/h; camera.fov = w<600?48:42; camera.updateProjectionMatrix(); if(!camTween){ const p=poseOf(mode); camera.position.copy(p.p); controls.target.copy(p.t); } }
new ResizeObserver(resize).observe(stage);

/* ---------- frame ---------- */
const ease = x => x<.5? 4*x*x*x : 1-Math.pow(-2*x+2,3)/2;
let lastKey='', keyMd='', keyAd='', keyPd='', last=performance.now(), lastUI=0;
function frame(t){
  const dt=Math.min((t-last)/1000,.05); last=t;
  if(playing){ viewMs += dt*2*YEAR; if(viewMs>S.birthMs+120*YEAR){ viewMs=S.birthMs+120*YEAR; playing=false; setPlay(); } }
  if(viewMs < S.birthMs) viewMs = S.birthMs;
  const A = at(S, viewMs);
  if(lastKey===''){ keyMd=keyAd=keyPd=''; lastKey='x'; }
  // chapter dial: the full 120-year round, starting with Ketu at 12 o'clock
  if(keyMd!=='built'){ keyMd='built'; buildDial('md', G.map((g,i)=>({i, yrs:g.y})), 120, A.md.i); }
  if(keyAd!==String(A.md.start)){ keyAd=String(A.md.start); buildDial('ad', A.ads.map(p=>({i:p.i, yrs:p.yrs})), A.md.yrs, A.ad.i); renderLists(A); }
  if(keyPd!==String(A.ad.start)){ keyPd=String(A.ad.start); buildDial('pd', A.pds.map(p=>({i:p.i, yrs:p.yrs})), A.ad.yrs, A.pd.i); }
  // rotate each dial so "now" sits under the pointer at 12 o'clock
  const before = G.slice(0, A.md.i).reduce((s,g)=>s+g.y,0);
  const qMd = before + (viewMs - A.md.start)/YEAR;
  dials.md.spin.rotation.y = qMd/120*360*D;      // clockwise dial turns back so the pointer reads "now"
  dials.ad.spin.rotation.y = (viewMs - A.md.start)/(A.md.end-A.md.start)*360*D;
  dials.pd.spin.rotation.y = (viewMs - A.ad.start)/(A.ad.end-A.ad.start)*360*D;
  dials.md.gears.forEach(o=>{ const on = o.i===A.md.i; o.gear.rotation.y += dt*(on?1.4:0.12)*(o.j%2?1:-1); o.gear.scale.setScalar(on?1.25:1); });
  for(const [k,cur] of [['md',A.md.i],['ad',A.ad.i],['pd',A.pd.i]]) dials[k].arcs.forEach(o=>o.m.material.color.copy(o.i===cur? o.m.userData.full : o.m.userData.dim));
  dials.md.labels.forEach((l,j)=>l.element.classList.toggle('cur', j===A.md.i));
  dials.ad.labels.forEach((l,j)=>l.element.classList.toggle('cur', dials.ad.parts[j].i===A.ad.i));
  dials.pd.labels.forEach((l,j)=>l.element.classList.toggle('cur', dials.pd.parts[j].i===A.pd.i));

  // assemble / take apart
  const sp = REDUCED?1:1-Math.exp(-dt*3.2); mix.ex += ((mode==='apart'?1:0)-mix.ex)*sp; const ex = ease(Math.max(0,Math.min(1,mix.ex)));
  for(const k of ['md','ad','pd']){ const L=LEVEL[k], d=dials[k]; d.grp.position.y = L.yE*ex; d.grp.scale.setScalar(1+(L.sE-1)*ex); ringTitles[k].element.style.opacity = ex; }
  // pointer from the inner dial to the outer dial (and straight down when taken apart)
  const top = P(0, 5.45*(1), 2.1*ex+.12), pts = ptrGeo.attributes.position;
  const xr = (lev)=> P(0, (LEVEL[lev].rIn+LEVEL[lev].rOut)/2*(1+(LEVEL[lev].sE-1)*ex), LEVEL[lev].yE*ex);
  const a = ex>.5 ? xr('md').setY(2.1*ex+.6) : P(0,5.6,.12), b = ex>.5 ? xr('md').setY(-2.1*ex-.3) : P(0,1.55,.12);
  pts.setXYZ(0,a.x,a.y,a.z); pts.setXYZ(1,b.x,b.y,b.z); pts.needsUpdate=true;
  tri.position.copy(ex>.5? xr('md').setY(2.1*ex+.75) : P(0,5.75,.12)); tri.rotation.set(ex>.5? Math.PI : Math.PI/2, 0, 0);
  moon.position.y = -2.1*ex - .0; moon.visible = true;

  if(camTween){ camTween.k=Math.min(1,camTween.k+dt/camTween.dur); const u=ease(camTween.k); camera.position.lerpVectors(camTween.from.p,camTween.to.p,u); controls.target.lerpVectors(camTween.from.t,camTween.to.t,u); if(camTween.k>=1) camTween=null; }

  if(t-lastUI>150){ lastUI=t;
    const age = (viewMs - S.birthMs)/YEAR; $('age').value = Math.round(age*10);
    const isToday = Math.abs(viewMs-Date.now()) < 2*86400e3;
    $('agetxt').textContent = `${isToday?'Today':ymd(viewMs)} · age ${Math.floor(age)}`;
    $('nowline').innerHTML = `Chapter of <em>${G[A.md.i].who}</em>`;
    $('subline').textContent = `${G[A.md.i].k} ${y(A.md.start)}–${y(A.md.end)} · sub-chapter ${G[A.ad.i].k} to ${ym(A.ad.end)}`;
    renderDeep(A);
  }
  controls.update(); renderer.render(scene,camera); labelR.render(scene,camera); requestAnimationFrame(frame);
}
function renderLists(A){
  const list = mahas(S).filter(p=>p.end > S.birthMs && p.start < S.birthMs + 100*YEAR);
  $('mdlist').innerHTML = list.map(p=>{ const g=G[p.i], cur = p.start===A.md.start, past = p.end < viewMs;
    return `<div class="md${cur?' cur':''}${past&&!cur?' past':''}"><span class="dot" style="background:${g.rim?'#231b17':hex(g.c)};${g.rim?'border:1.5px solid #FF6B2C':''}"></span><span><div class="who">${g.who}</div><div class="nm">${g.k} · ${g.y} years</div></span><span class="yr">${y(Math.max(p.start,S.birthMs))}–${y(p.end)}</span></div>`; }).join('');
}
function renderDeep(A){
  const md=G[A.md.i], ad=G[A.ad.i], pd=G[A.pd.i];
  $('deep').innerHTML = `<b>Sub-chapter</b> <span>(antardasha)</span><br>${ad.who} · ${ad.k}: ${ymd(A.ad.start)} → ${ymd(A.ad.end)}<br><b>Scene</b> <span>(pratyantardasha)</span><br>${pd.who} · ${pd.k}: ${ymd(A.pd.start)} → ${ymd(A.pd.end)}`;
  const adY = md.y*ad.y/120;
  $('formula').innerHTML = `Sub-chapter length = chapter years × sub-graha years ÷ 120<br>${md.k} ${md.y} × ${ad.k} ${ad.y} ÷ 120 = <b>${dur(adY)}</b>`;
}

recompute(false);
viewMs = Math.max(Date.now(), S.birthMs);
resize(); { const p=poseOf('assembled'); camera.position.copy(p.p); controls.target.copy(p.t); }
requestAnimationFrame(frame);
</script>
